name: 问题反馈
description: 报告可以复现的问题
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: 版本与设备
      description: DS Bot Go、Android、桌面 DS Bot 和 Remote 的版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写出最短操作过程、当前结果和期望结果。不要上传凭据或私人聊天。
    validations:
      required: true
